server {
  listen 8443 ssl;
  ssl_certificate /etc/award-tls/server.crt;
  ssl_certificate_key /etc/award-tls/server.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_tickets off;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy same-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 48m;

  location = /healthz { access_log off; return 200 "ok\n"; }
  location /_protected-downloads/ {
    internal;
    alias /srv/media/protected/;
    sendfile on;
    # No application bandwidth cap. Chunk size is per syscall, not per second.
    limit_rate 0;
    limit_rate_after 0;
    sendfile_max_chunk 2m;
    tcp_nopush on;
    tcp_nodelay on;
    read_ahead 256k;
    max_ranges 1;
    gzip off;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options nosniff always;
  }
  location /api/ {
    proxy_buffering off;
    proxy_read_timeout 180s;
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /ppt-editor/ {
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' data: blob:; connect-src 'self' blob:; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri $uri/ =404;
  }
  location / { try_files $uri $uri/ /index.html; }
}

server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  location = /healthz { access_log off; return 200 "ok\n"; }
  # No business APIs on cleartext HTTP. Static renderer is used on the private Docker network.
  location /ppt-editor/ { try_files $uri $uri/ =404; }
  location / { return 308 https://${APP_PUBLIC_HOST}:${APP_TLS_PORT}$request_uri; }
}
