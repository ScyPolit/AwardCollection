name: awardcollection-v1-test
x-application-logging: &application-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
services:
  db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-awardcollection}
      POSTGRES_USER: ${POSTGRES_USER:-awardcollection}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-awardcollection} -d ${POSTGRES_DB:-awardcollection}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [internal]
    deploy:
      resources:
        limits: {memory: 1G}

  api:
    security_opt: ["no-new-privileges:true"]
    logging: *application-logging
    build:
      context: ${APP_SOURCE_DIR:-.}/backend
      args:
        APP_BUILD_VERSION: ${APP_BUILD_VERSION:-development}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-awardcollection}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-awardcollection}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-192.168.31.12,localhost,127.0.0.1}
      DJANGO_SECURE_COOKIES: "true"
      USE_ACCEL_DOWNLOAD: "true"
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-https://192.168.31.12:18443}
      SIGNING_KEY_PASSWORD: ${SIGNING_KEY_PASSWORD}
      CERTIFICATE_FONT: ${CERTIFICATE_FONT:-/srv/media/fonts/wqy-zenhei.ttc}
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      APP_BUILD_VERSION: ${APP_BUILD_VERSION:-development}
      MEDIA_ROOT: /srv/media
      BACKUP_ROOT: /srv/backups
    depends_on:
      db: {condition: service_healthy}
    volumes:
      - media_data:/srv/media
      - backup_data:/srv/backups
    networks: [internal, conversion]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits: {memory: 1G}

  worker:
    security_opt: ["no-new-privileges:true"]
    logging: *application-logging
    build:
      context: ${APP_SOURCE_DIR:-.}/backend
      args:
        APP_BUILD_VERSION: ${APP_BUILD_VERSION:-development}
    restart: unless-stopped
    command: ["python", "manage.py", "runworker"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-awardcollection}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-awardcollection}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      SIGNING_KEY_PASSWORD: ${SIGNING_KEY_PASSWORD}
      CERTIFICATE_FONT: ${CERTIFICATE_FONT:-/srv/media/fonts/wqy-zenhei.ttc}
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      APP_BUILD_VERSION: ${APP_BUILD_VERSION:-development}
      MEDIA_ROOT: /srv/media
      BACKUP_ROOT: /srv/backups
      WORKER_CONCURRENCY: "1"
      RENDER_CONCURRENCY: ${RENDER_CONCURRENCY:-1}
    depends_on:
      db: {condition: service_healthy}
      api: {condition: service_healthy}
    volumes:
      - media_data:/srv/media
      - backup_data:/srv/backups
    networks: [internal]
    deploy:
      resources:
        limits: {memory: 2G}

  converter:
    logging: *application-logging
    build:
      context: ${APP_SOURCE_DIR:-.}/converter
      args:
        APP_BUILD_VERSION: ${APP_BUILD_VERSION:-development}
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=512m,uid=10001,gid=10001"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 80
    networks: [conversion]
    deploy:
      resources:
        limits: {memory: 768M, cpus: "1", pids: 80}

  web:
    logging: *application-logging
    build:
      context: ${APP_SOURCE_DIR:-.}/frontend
      args:
        APP_BUILD_VERSION: ${APP_BUILD_VERSION:-development}
    restart: unless-stopped
    environment:
      APP_PUBLIC_HOST: ${APP_PUBLIC_HOST:-192.168.31.12}
      APP_TLS_PORT: ${APP_TLS_PORT:-18443}
      NGINX_ENVSUBST_FILTER: ^APP_
    depends_on:
      api: {condition: service_healthy}
    ports:
      - "${APP_PORT:-18080}:8080"
      - "${APP_TLS_PORT:-18443}:8443"
    volumes:
      - tls_data:/etc/award-tls
      - media_data:/srv/media:ro
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits: {memory: 256M}

secrets:
  db_password:
    file: ./secrets/db_password.txt
volumes:
  db_data:
  media_data:
  backup_data:
  tls_data:
networks:
  conversion:
    internal: true
  internal:
    driver: bridge
